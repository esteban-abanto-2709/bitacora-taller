name: bitacora-taller

services:
  web:
    image: node:24-alpine
    container_name: bitacora-taller-web
    working_dir: /app
    volumes:
      - ../web:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
      - pnpm_store:/pnpm/store
    environment:
      CI: "true"
      npm_config_store_dir: /pnpm/store
      WATCHPACK_POLLING: "true"
    env_file:
      - path: ../web/.env.local
        required: false
    command: sh -c "corepack enable && pnpm install --frozen-lockfile && pnpm dev --hostname 0.0.0.0"
    ports:
      - "3000:3000"

volumes:
  web_node_modules:
  web_next:
  pnpm_store:
